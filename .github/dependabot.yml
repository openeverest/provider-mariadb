# mariadb-operator is pinned twice: as a Go module (its API types, in go.mod)
# and as the bundled Helm subcharts (mariadb-operator and mariadb-operator-crds in
# charts/provider-mariadb/Chart.yaml). They are placed in one multi-ecosystem
# group so a new operator release arrives as a single PR that bumps them together.
# A new major version changes the module path (/v26 -> /v27) and needs a manual bump.
version: 2

multi-ecosystem-groups:
  mariadb-operator:
    schedule:
      interval: "daily"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    allow:
      - dependency-name: "github.com/mariadb-operator/mariadb-operator/v26"
    patterns:
      - "github.com/mariadb-operator/mariadb-operator/v26"
    multi-ecosystem-group: "mariadb-operator"

  - package-ecosystem: "helm"
    directory: "/charts/provider-mariadb"
    allow:
      - dependency-name: "mariadb-operator"
      - dependency-name: "mariadb-operator-crds"
    patterns:
      - "mariadb-operator"
      - "mariadb-operator-crds"
    multi-ecosystem-group: "mariadb-operator"
