# Example Instance CR for the provider-mariadb provider sending metrics to a
# monitoring destination.
#
# Prerequisites:
#   1. OpenEverest CRDs installed
#   2. Provider CR applied (provider.yaml)
#   3. Operator running
#   4. Provider controller running
#   5. A MonitoringDestination named "prometheus" in the Instance's namespace,
#      of a class that scrapes metrics (e.g. the monitoring-prometheus or
#      monitoring-victoriametrics extension), and that class's extension
#      running.
#
# While a destination's class requires metrics, the mariadb-operator runs a
# mysqld-exporter Deployment and the class's extension creates the scrape
# objects from the endpoints the Instance publishes in
# status.monitoring.sources.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example-instance-monitoring
spec:
  providerRef:
    name: mariadb
  components:
    engine:
      type: mariadb
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 2G
      storage:
        size: 10Gi
  monitoring:
    destinations:
      - name: prometheus
        destinationRef:
          name: prometheus
