# Example Instance restricting engine pods to nodes with specific labels.
#
# `spec.components.engine.schedulingPolicy.affinity.nodeAffinity` takes a
# standard Kubernetes node affinity. The equivalent deprecated form is the
# `spec.components.engine.parameters.nodeAffinity` rules list
# ("disktype In ssd,nvme" / "gpu Exists"); the two are mutually exclusive.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: mariadb-node-affinity
spec:
  providerRef:
    name: mariadb
  components:
    engine:
      type: mariadb
      replicas: 1
      storage:
        size: 10Gi
      schedulingPolicy:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: disktype
                      operator: In
                      values: [ssd, nvme]
                    - key: gpu
                      operator: Exists
