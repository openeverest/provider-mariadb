# Example Instance with pod anti-affinity and node affinity.
#
# The engine component accepts a standard Kubernetes affinity under
# `spec.components.engine.schedulingPolicy.affinity`. The provider maps it onto the
# mariadb-operator's affinity configuration.
#
# Supported: `nodeAffinity` and `podAntiAffinity`.
# Not supported: `podAffinity` (rejected at admission — the operator cannot
# express pod co-location).
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: mariadb-anti-affinity
spec:
  providerRef:
    name: mariadb
  components:
    engine:
      type: mariadb
      replicas: 3
      resources:
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 10Gi
      schedulingPolicy:
        affinity:
          # Spread each MariaDB pod onto a different node for HA.
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - mariadb-anti-affinity
          # Prefer nodes labeled as SSD-backed.
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 10
                preference:
                  matchExpressions:
                    - key: disktype
                      operator: In
                      values:
                        - ssd
