# Example Instance with the Galera HA topology (multi-master cluster).
#
# Galera requires an odd number of nodes (>= 3) to maintain quorum. The provider
# defaults new Galera clusters to 3 nodes and applies a soft pod anti-affinity
# so nodes are spread across hosts.
#
# Clients connect through the primary Service (<name>-primary), which routes
# writes to the current primary node. The connection details in the generated
# Secret already point at it.
#
# The topology is immutable: an existing standalone instance cannot be switched
# to Galera (or vice versa).
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: mariadb-galera
spec:
  providerRef:
    name: mariadb
  topology:
    type: galera
  components:
    engine:
      type: mariadb
      replicas: 3
      resources:
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 10Gi
