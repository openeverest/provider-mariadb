# MariaDB BackupClass definition.
# This file is the source of truth for the generated BackupClass manifest.
#
# Fields:
#   displayName/description: human-readable metadata.
#   supportedProviders: providers this class can be used with.
#   executionMode: "ProviderManaged" (operator-native) or "Job".
#   providerManaged.supportsPITR: advertise PITR capability to Restore validation.
#   providerManaged.limits: caps the runtime enforces against Instance.spec.backup.
#     maxStorages, maxPITREnabledStorages, maxSchedulesPerStorage — unset means unlimited.
#   parametersSchema.openAPIV3Schema / restoreParametersSchema.openAPIV3Schema:
#     Go type names describing backup-time and restore-time parameters respectively.
#
# Co-located files:
#   types.go — Go types referenced above; OpenAPI-extracted by provider-sdk generate.

displayName: "MariaDB backup"
description: |
  BackupClass for the MariaDB provider, driven natively by the mariadb-operator
  to an S3-compatible object store; OpenEverest does not run any side-car Job for
  this class. Each backup selects its strategy via the `type` parameter:
  "logical" takes a mariadb-dump SQL dump (restored in place), while "physical"
  takes a mariadb-backup data-directory snapshot (restored by seeding a new
  Instance from spec.dataSource; in-place restore is not supported by the engine
  for physical backups).
supportedProviders:
  - mariadb
executionMode: ProviderManaged

providerManaged:
  # Point-in-time recovery is not supported yet.
  supportsPITR: false

parametersSchema:
  openAPIV3Schema: MariadbBackupParameters

restoreParametersSchema:
  openAPIV3Schema: MariadbRestoreParameters
