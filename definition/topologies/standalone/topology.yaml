# Standalone topology definition: a single MariaDB node with no HA.
# This is the MVP/Phase 1 topology — simple, lowest operational risk.

config:
  components:
    engine:
      defaults:
        replicas: 1

ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Select the MariaDB version to deploy."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "Database Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            modes:
              edit:
                disabled: true
              restore:
                disabled: true
          validation:
            required: true

    resources:
      label: "Resources"
      description: "Configure the CPU, memory, and storage for your MariaDB node."
      components:
        nodes:
          uiType: group
          components:
            numberOfNodes:
              path: "spec.components.engine.replicas"
              uiType: number
              fieldParams:
                label: "Number of nodes"
                defaultValue: 1
              validation:
                required: true
                min: 1
                int: true

            resources:
              uiType: group
              groupType: line
              components:
                cpu:
                  path: "spec.components.engine.resources.limits.cpu"
                  uiType: number
                  fieldParams:
                    label: "CPU"
                    defaultValue: 1
                    step: 1
                  validation:
                    min: 0.5
                    required: true
                memory:
                  path: "spec.components.engine.resources.limits.memory"
                  uiType: number
                  fieldParams:
                    label: "Memory"
                    defaultValue: 2
                    step: 0.5
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 0.5
                    required: true
                disk:
                  path: "spec.components.engine.storage.size"
                  uiType: number
                  fieldParams:
                    label: "Disk"
                    defaultValue: 10
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 1
                    int: true
                    required: true
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: "spec.components.engine.storage.size >= original.spec.components.engine.storage.size"
                            message: "Disk size cannot be decreased"
          componentsOrder:
            - numberOfNodes
            - resources

    monitoring:
      label: "Monitoring"
      description: "Expose database metrics and integrate them with a Prometheus stack."
      components:
        enabled:
          uiType: select
          path: spec.components.monitoring.parameters.enabled
          fieldParams:
            label: "Enable metrics"
            defaultValue: "false"
            options:
              - label: "Disabled"
                value: "false"
              - label: "Enabled"
                value: "true"
      componentsOrder:
        - enabled

    advanced:
      label: "Advanced configuration"
      description: "Configure storage class and optional MariaDB settings."
      components:
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          fieldParams:
            label: "Storage class"
            modes:
              edit:
                disabled: true
          dataSource:
            provider: storageClasses
        externalAccess:
          uiType: select
          path: spec.components.engine.service.serviceType
          fieldParams:
            label: "External access"
            defaultValue: "ClusterIP"
            options:
              - label: "ClusterIP"
                value: "ClusterIP"
              - label: "LoadBalancer"
                value: "LoadBalancer"
              - label: "NodePort"
                value: "NodePort"
        configuration:
          uiType: text
          path: spec.components.engine.config
          fieldParams:
            label: "Engine configuration (my.cnf)"
            placeholder: |
              [mariadb]
              max_connections=100
            multiline: true
            minRows: 3
            maxRows: 8
      componentsOrder:
        - storageClass
        - externalAccess
        - configuration

  sectionsOrder:
    - databaseVersion
    - resources
    - monitoring
    - advanced
