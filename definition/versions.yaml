# Component type version catalog.
# Add new versions here when new MariaDB versions are released.
# Name the default version per type via `defaultVersion`.

componentTypes:
  mariadb:
    defaultVersion: "12.3"
    versions:
    - version: "10.11"
      image: mariadb:10.11
    - version: "11.4"
      image: mariadb:11.4
    - version: "11.8"
      image: mariadb:11.8
    - version: "12.3"
      image: mariadb:12.3
  # Exporter the mariadb-operator runs while a monitoring destination requires
  # metrics. Not a component of its own, so bundles do not pin it.
  mysqld-exporter:
    defaultVersion: "0.15.1"
    versions:
    - version: "0.15.1"
      image: prom/mysqld-exporter:v0.15.1
  maxscale:
    defaultVersion: "23.08.13"
    versions:
    - version: "23.08.13"
      image: mariadb/maxscale:23.08.13-2

# Version bundles — curated sets of component versions known to work together.
# Users set spec.version on an Instance to select a bundle.
# The bundle named by defaultVersion is used when spec.version is omitted.
defaultVersion: "12.3"
versions:
- name: "10.11"
  components:
    engine: "10.11"
    proxy: "23.08.13"
- name: "11.4"
  components:
    engine: "11.4"
    proxy: "23.08.13"
- name: "11.8"
  components:
    engine: "11.8"
    proxy: "23.08.13"
- name: "12.3"
  components:
    engine: "12.3"
    proxy: "23.08.13"
