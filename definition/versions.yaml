# Component type version catalog.
# Add new versions here when new MariaDB versions are released.
# Mark exactly one version per type as `default: true`.

componentTypes:
  mariadb:
    versions:
    - version: "11.4"
      image: mariadb:11.4
    - version: "11.8"
      image: mariadb:11.8
    - version: "12.3"
      image: mariadb:12.3
      default: true
  mysqld-exporter:
    versions:
    - version: "0.15.1"
      image: prom/mysqld-exporter:v0.15.1
      default: true
  maxscale:
    versions:
    - version: "23.08.13"
      image: mariadb/maxscale:23.08.13-2
      default: true

# Version bundles — curated sets of component versions known to work together.
# Users set spec.version on an Instance to select a bundle.
# The bundle with default: true is used when spec.version is omitted.
versions:
- name: "11.4"
  components:
    engine: "11.4"
    monitoring: "0.15.1"
    proxy: "23.08.13"
- name: "11.8"
  components:
    engine: "11.8"
    monitoring: "0.15.1"
    proxy: "23.08.13"
- name: "12.3"
  default: true
  components:
    engine: "12.3"
    monitoring: "0.15.1"
    proxy: "23.08.13"
