# Provider identity and component definitions.
# Component types define what software each component runs (e.g. mongod, backup).
# Component names are the logical roles used in topologies (e.g. engine, proxy).
#
# Run `provider-sdk add component` to add components interactively.
# For more details, see github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md.

name: mariadb

# Components map logical component names to their type.
# The type must match a key in versions.yaml's componentTypes.
# parametersSchema references a Go type in definition/components/ describing
# the component's parameters payload; omit it for components without parameters.
components:
  engine:
    type: mariadb
    parametersSchema: MariadbParameters
