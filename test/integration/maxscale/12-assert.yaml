# Expected outcome of the primary-failover step: the old primary rejoined as a
# replica (auto_rejoin), so all three servers are running with exactly one
# master, and the Instance is Ready again.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MaxScale
metadata:
  name: test-maxscale-maxscale
status:
  (length(servers[?contains(state, 'Running')])): 3
  (length(servers[?contains(state, 'Master')])): 1
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-maxscale
status:
  phase: Ready
