# Expected outcome of the cluster-running step: MaxScale reports a primary
# server, failover stays with the operator, and the connection details published
# by the runtime point at the MaxScale Service.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-maxscale
status:
  phase: Ready
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: test-maxscale
spec:
  (maxScaleRef == null): true
  replication:
    semiSyncBootAsReplica: true
    primary:
      autoFailover: true
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MaxScale
metadata:
  name: test-maxscale-maxscale
spec:
  # MaxScale must not change the topology behind the operator's back (#37).
  monitor:
    module: mariadbmon
    params:
      auto_failover: "false"
      auto_rejoin: "false"
      switchover_on_low_disk_space: "false"
status:
  (primaryServer != null): true
  (conditions[?type == 'Ready']):
    - status: "True"
---
apiVersion: v1
kind: Secret
metadata:
  name: test-maxscale-conn
(base64_decode(data.password) != ''): true
(contains(base64_decode(data.host), 'test-maxscale-maxscale')): true
---
apiVersion: v1
kind: Service
metadata:
  name: test-maxscale-maxscale
