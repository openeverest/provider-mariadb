# Expected outcome of the disable-proxy step: the connection details point back
# at the primary Service.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-maxscale
status:
  phase: Ready
---
apiVersion: v1
kind: Secret
metadata:
  name: test-maxscale-conn
(contains(base64_decode(data.host), 'test-maxscale-primary')): true
