# The source of point-in-time recovery: an async replication MariaDB with PITR
# enabled on the MinIO storage. A physical backup schedule on that storage
# serves as the full base backup; the provider reconciles a PointInTimeRecovery
# CR and turns on binary log archival on the primary.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: pitr-source
spec:
  providerRef:
    name: mariadb
  topology:
    type: replication
  components:
    engine:
      type: mariadb
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 1G
        requests:
          cpu: 250m
          memory: 512M
      storage:
        size: 1Gi
  backup:
    enabled: true
    classRef:
      name: mariadb
    storages:
      - storageRef:
          name: minio-s3
        pitr:
          enabled: true
        schedules:
          - name: base
            enabled: true
            cron: "*/5 * * * *"
            parameters:
              type: physical
