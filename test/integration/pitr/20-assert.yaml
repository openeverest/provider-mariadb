# The provider translates the PITR-enabled source Instance into a replication
# MariaDB CR.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: pitr-source
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: pitr-source
spec:
  replicas: 3
  replication:
    enabled: true
