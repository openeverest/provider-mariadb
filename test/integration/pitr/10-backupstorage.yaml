# S3 BackupStorage (+ credentials Secret) for the PITR suite, pointing at the
# shared in-cluster SeaweedFS deployed in the `seaweedfs` namespace.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-credentials
type: Opaque
data:
  # seaweedfsadmin / seaweedfsadmin
  AWS_ACCESS_KEY_ID: c2Vhd2VlZGZzYWRtaW4=
  AWS_SECRET_ACCESS_KEY: c2Vhd2VlZGZzYWRtaW4=
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: seaweedfs-s3
spec:
  backupStorageClassRef:
    name: s3
  location:
    bucket: backups
  parameters:
    region: us-east-1
    endpointURL: http://seaweedfs.seaweedfs.svc.cluster.local
    forcePathStyle: true
    implementation: other
  authentication:
    mode: AccessKey
    credentialsSecretRef:
      name: seaweedfs-credentials
