---
# Point-in-time recovery suite.
#
# End-to-end proof that PITR (async replication topology, a storage with
# pitr.enabled) can seed a brand-new Instance recovered to the latest
# archived point:
#   1. Deploy MinIO (S3) and create the backup bucket.
#   2. Provision a replication source MariaDB with PITR enabled; the provider
#      reconciles a PointInTimeRecovery CR + base PhysicalBackup and turns on
#      binary log archival (MariaDB.spec.pointInTimeRecoveryRef).
#   3. Write a sentinel row.
#   4. Wait for the base backup + binlog archival so the recovery window
#      (instance.status.backup.storages[].pitr) becomes Available.
#   5. Seed a new Instance via spec.dataSource type PointInTime (recoveryTarget
#      latest); the provider wires MariaDB.spec.bootstrapFrom.pointInTimeRecoveryRef.
#   6. Assert the recovered cluster comes up Ready and still holds the row.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pitr
spec:
  description: |
    Point-in-time recovery of a replication source Instance: enable PITR, archive
    binary logs to MinIO, then recover into a new Instance via spec.dataSource
    (PointInTime, latest), verifying the data survives the round-trip.

  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,mariadb,pointintimerecovery,physicalbackup,pods -o wide
    - script:
        content: kubectl -n $NAMESPACE get pointintimerecovery,physicalbackup,mariadb -o yaml
    - script:
        content: |
          ns=$(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
            -o jsonpath='{.items[0].metadata.namespace}')
          [ -n "$ns" ] && kubectl -n "$ns" logs -l app.kubernetes.io/name=provider-mariadb \
            --all-containers --tail 200 || echo "provider deployment not found"

  steps:
    - name: provider-deployed
      try:
        - script:
            content: |
              set -eu
              avail=$(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
                -o jsonpath='{.items[*].status.availableReplicas}')
              echo "provider available replicas: ${avail:-0}"
              echo "${avail}" | grep -q '[1-9]'

    # Deploy the shared MinIO (idempotent) and ensure the backup bucket exists.
    - name: setup-minio
      timeouts:
        exec: 8m
      try:
        - script:
            content: |
              set -eu
              kubectl apply -f "${PROVIDER_ROOT_PATH}/dev/resources/minio.yaml"
              kubectl -n minio rollout status deploy/minio --timeout=180s
              # Create the bucket the BackupStorage points at (idempotent,
              # best-effort; MinIO is already confirmed up above). Run a one-shot
              # pod without stdin attach and poll for completion: `kubectl run -i
              # --rm` can spuriously report a timeout when the pod completes
              # before the attach connects, and a fixed `kubectl wait` is too
              # tight when the mc image pull is slow.
              kubectl -n minio delete pod mc-mb --ignore-not-found
              kubectl -n minio run mc-mb --image=minio/mc:latest --restart=Never --command -- \
                sh -c "mc alias set local http://minio.minio.svc.cluster.local:9000 minioadmin minioadmin && (mc mb local/backups || true)"
              for _ in $(seq 1 48); do
                phase=$(kubectl -n minio get pod mc-mb -o jsonpath='{.status.phase}' 2>/dev/null || true)
                case "$phase" in Succeeded|Failed) break;; esac
                sleep 5
              done
              echo "mc-mb pod phase: ${phase:-unknown}"
              kubectl -n minio logs mc-mb || true
              kubectl -n minio delete pod mc-mb --ignore-not-found

    - name: backup-storage
      try:
        - apply:
            file: 10-backupstorage.yaml

    - name: source-instance
      try:
        - apply:
            file: 20-source-instance.yaml
        - assert:
            file: 20-assert.yaml

    - name: source-running
      timeouts:
        assert: 10m
      try:
        - assert:
            file: 21-assert.yaml

    # The provider wired PITR: CR, base backup and the MariaDB reference.
    - name: pitr-configured
      timeouts:
        assert: 5m
      try:
        - assert:
            file: 30-assert.yaml

    # Write a sentinel row that must survive recovery. Enabling PITR triggers a
    # rolling update, and connecting to the replication primary as the everest
    # user is unreliable, so write as root via the primary pod's local socket
    # (root's password comes from the instance's own root Secret). Retry to ride
    # out the rollout; FLUSH BINARY LOGS forces the write into an archived binlog.
    - name: seed-data
      timeouts:
        exec: 12m
      try:
        - script:
            content: |
              set -eu
              rootpw=$(kubectl -n "$NAMESPACE" get secret everest-secrets-pitr-source-root \
                -o jsonpath='{.data.root-password}' | base64 -d)
              ok=0
              for attempt in $(seq 1 40); do
                primary=$(kubectl -n "$NAMESPACE" get pod -l 'k8s.mariadb.com/role=primary' \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                if [ -n "$primary" ] && kubectl -n "$NAMESPACE" exec "$primary" -c mariadb -- \
                  env MYSQL_PWD="$rootpw" mariadb -u root -e \
                  "CREATE TABLE IF NOT EXISTS everest.pitr_probe (id INT PRIMARY KEY); INSERT INTO everest.pitr_probe (id) VALUES (42) ON DUPLICATE KEY UPDATE id=id; FLUSH BINARY LOGS;"; then
                  echo "seeded via ${primary}"
                  ok=1; break
                fi
                echo "seed attempt ${attempt} failed (primary not ready?); retrying in 15s..."
                sleep 15
              done
              [ "$ok" = 1 ]

    # Wait for the base backup + binlog archival so a recovery window exists.
    - name: recovery-window-available
      timeouts:
        assert: 12m
      try:
        - assert:
            file: 40-assert.yaml

    # Recover a brand-new Instance to the latest archived point.
    - name: recover-instance
      try:
        - apply:
            file: 50-restore-instance.yaml
        - assert:
            file: 50-assert.yaml

    - name: recovered-running
      timeouts:
        assert: 10m
      try:
        - assert:
            file: 51-assert.yaml

    # The sentinel row must be present in the recovered cluster. Read it as root
    # via the restored pod's local socket (the provider copied the source's root
    # Secret onto the restored instance). Retry to ride out any post-Ready blip.
    - name: verify-data
      timeouts:
        exec: 5m
      try:
        - script:
            content: |
              set -eu
              rootpw=$(kubectl -n "$NAMESPACE" get secret everest-secrets-pitr-restored-root \
                -o jsonpath='{.data.root-password}' | base64 -d)
              ok=0
              for attempt in $(seq 1 12); do
                out=$(kubectl -n "$NAMESPACE" exec pitr-restored-0 -c mariadb -- \
                  env MYSQL_PWD="$rootpw" mariadb -u root -Nse \
                  "SELECT id FROM everest.pitr_probe WHERE id=42;" 2>&1 || true)
                echo "$out"
                if [ "$out" = "42" ]; then
                  echo "pitr probe row present: $out"
                  ok=1; break
                fi
                echo "verify attempt ${attempt}: got '${out}', retrying in 15s..."
                sleep 15
              done
              [ "$ok" = 1 ]

    - name: delete-instances
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: pitr-restored
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: pitr-source
        - wait:
            apiVersion: k8s.mariadb.com/v1alpha1
            kind: MariaDB
            name: pitr-source
            timeout: 3m
            for:
              deletion: {}
