# The downgrade is not applied: the Instance stays Ready and the MariaDB stays
# on its version.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
status:
  phase: Ready
(length(status.conditions[?type == 'Ready' && status == 'True'] || `[]`) > `0`): true
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: test-instance
spec:
  image: mariadb:12.3
