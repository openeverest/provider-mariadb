# Expected outcome of the instance-running step: once the real mariadb-operator
# provisions the cluster, the provider's Status() surfaces phase Ready and the
# runtime publishes connection details.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
status:
  phase: Ready
---
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-ca-bundle
(base64_decode(data."ca.crt") != ''): true
---
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-conn
(base64_decode(data.tls) == 'true'): true
(base64_decode(data."ca.crt") != ''): true
# The runtime writes connection details here; a non-empty password proves the
# initial-user credentials were generated.
(base64_decode(data.password) != ''): true
