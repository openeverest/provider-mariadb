---
# Admission webhook suite.
#
# Checks the provider's Instance admission webhook against the real
# mariadb-operator. The provider is located by label, as in the core suite.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core-admission
spec:
  description: |
    The provider's admission webhook: it rejects an invalid Instance with the
    field path, admits it while the provider is down, blocks an update only
    on errors the stored Instance did not already have, rejects another
    provider's backup class, and warns about a missing user Secret.
  # Scales the provider down, which every other test depends on.
  concurrent: false

  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,mariadb,pods -o wide
    - script:
        content: kubectl -n $NAMESPACE get instance,mariadb -o yaml
    - script:
        content: |
          ns=$(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
            -o jsonpath='{.items[0].metadata.namespace}')
          [ -n "$ns" ] && kubectl -n "$ns" logs -l app.kubernetes.io/name=provider-mariadb \
            --all-containers --tail 100 || echo "provider deployment not found"

  steps:
    - name: provider-ready
      try:
        - script:
            content: |
              set -eu
              avail=$(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
                -o jsonpath='{.items[*].status.availableReplicas}')
              echo "provider available replicas: ${avail:-0}"
              echo "${avail}" | grep -q '[1-9]'
        - assert:
            file: 00-assert.yaml

    - name: reject-invalid
      try:
        - script:
            content: kubectl apply --dry-run=server -n $NAMESPACE -f 10-invalid-instance.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.components[engine].replicas')): true
        - script:
            content: kubectl apply -n $NAMESPACE -f 10-invalid-instance.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.components[engine].replicas')): true
        - error:
            file: 10-error.yaml

    - name: admit-while-provider-down
      try:
        - script:
            timeout: 1m
            content: |
              set -eu
              set -- $(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
                -o jsonpath='{.items[0].metadata.namespace} {.items[0].metadata.name}')
              kubectl -n "$1" scale deployment/"$2" --replicas=0
              while kubectl -n "$1" get pods -o name \
                -l app.kubernetes.io/name=provider-mariadb | grep -q .; do
                sleep 1
              done
        - apply:
            file: 10-invalid-instance.yaml
      finally:
        - script:
            timeout: 2m
            content: |
              set -eu
              set -- $(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
                -o jsonpath='{.items[0].metadata.namespace} {.items[0].metadata.name}')
              kubectl -n "$1" scale deployment/"$2" --replicas=1
              kubectl -n "$1" rollout status deployment/"$2" --timeout=110s

    - name: report-once-back
      timeouts:
        assert: 2m
      try:
        - assert:
            file: 20-assert.yaml

    - name: block-new-errors-only
      try:
        - script:
            timeout: 1m
            content: |
              # Writes are admitted until the webhook serves again.
              for i in $(seq 1 25); do
                kubectl apply --dry-run=server -n $NAMESPACE -f 30-new-error.yaml >/dev/null 2>&1 || break
                sleep 2
              done
              kubectl apply -n $NAMESPACE -f 30-new-error.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.components[engine].storage.size')): true
              (contains($stderr, 'spec.components[engine].replicas')): false
        - script:
            content: kubectl apply -n $NAMESPACE -f 31-unrelated-change.yaml
        - assert:
            file: 31-assert.yaml

    - name: fix
      try:
        - apply:
            file: 40-fixed-instance.yaml
        - assert:
            file: 40-assert.yaml

    - name: reject-another-providers-backup-class
      try:
        - apply:
            file: 50-other-provider-class.yaml
        - script:
            content: kubectl apply -n $NAMESPACE -f 51-other-provider-class.yaml
            check:
              ($error != null): true
              (contains($stderr, 'spec.backup.classRef.name')): true

    - name: warn-about-a-missing-user-secret
      try:
        - script:
            content: kubectl apply -n $NAMESPACE -f 52-missing-user-secret.yaml
            check:
              ($error == null): true
              (contains($stderr, 'test-admission-missing-users named by spec.userSecretRef not found')): true
      cleanup:
        - script:
            timeout: 2m
            content: kubectl -n $NAMESPACE delete instance/test-mariadb-nosecret --ignore-not-found --timeout=110s

    - name: delete-instance
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: test-mariadb-admission
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-mariadb-admission
            timeout: 2m
            for:
              deletion: {}
        - wait:
            apiVersion: k8s.mariadb.com/v1alpha1
            kind: MariaDB
            name: test-mariadb-admission
            timeout: 3m
            for:
              deletion: {}
