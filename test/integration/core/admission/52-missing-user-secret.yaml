apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-mariadb-nosecret
spec:
  providerRef:
    name: mariadb
  userSecretRef:
    name: test-admission-missing-users
  components:
    engine:
      type: mariadb
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 1G
        requests:
          cpu: 250m
          memory: 512M
      storage:
        size: 1Gi
