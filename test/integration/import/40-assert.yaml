# Once a base backup has completed and binary logs have been archived, the
# provider publishes the recovery window on the Instance status.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: import-source
status:
  backup:
    storages:
      - name: import-s3
        pitr:
          state: Available
          (latestRestorableTime != ''): true
