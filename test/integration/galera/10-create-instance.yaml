# A 3-node Galera MariaDB Instance used by the galera HA suite.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-galera
spec:
  providerRef:
    name: mariadb
  topology:
    type: galera
  components:
    engine:
      type: mariadb
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 1G
        requests:
          cpu: 250m
          memory: 512M
      storage:
        size: 1Gi
