# Expected outcome of the cluster-running step: once the real mariadb-operator
# bootstraps the 3-node Galera cluster, the provider's Status() surfaces phase
# Ready and the runtime publishes connection details pointing at the primary
# Service. The operator also creates an HA PodDisruptionBudget for the cluster.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-galera
status:
  phase: Ready
---
apiVersion: v1
kind: Secret
metadata:
  name: test-galera-conn
# The runtime writes connection details here; a non-empty password proves the
# initial-user credentials were generated. The host resolves to the primary
# Service (test-galera-primary) for the Galera topology.
(base64_decode(data.password) != ''): true
(contains(base64_decode(data.host), 'test-galera-primary')): true
---
# The primary Service the provider maps exposure and connection details to.
apiVersion: v1
kind: Service
metadata:
  name: test-galera-primary
