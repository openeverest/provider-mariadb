# Expected outcome of the create-instance step.
#
# Assert both the accepted Instance and the MariaDB CR the provider creates from
# it. Chainsaw asserts are partial: only the fields listed here are checked. The
# key thing verified here is that the replication topology maps onto
# spec.replication (and not spec.galera).
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-replication
spec:
  topology:
    type: replication
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: test-replication
spec:
  replicas: 3
  replication:
    enabled: true
  tls:
    enabled: true
    required: false
  username: everest
  database: everest
  rootPasswordSecretKeyRef:
    name: everest-secrets-test-replication-root
    key: root-password
    generate: true
  passwordSecretKeyRef:
    name: everest-secrets-test-replication
    key: password
    generate: true
