# A single-node MariaDB Instance that is the source of a physical backup.
# Backups are enabled so the physical backup is written to the MinIO storage.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: physical-source
spec:
  providerRef:
    name: mariadb
  components:
    engine:
      type: mariadb
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 1G
        requests:
          cpu: 250m
          memory: 512M
      storage:
        size: 1Gi
  backup:
    enabled: true
    classRef:
      name: mariadb
    storages:
      - storageRef:
          name: minio-s3
