# On-demand physical backup of the source Instance to the SeaweedFS storage.
apiVersion: backup.openeverest.io/v1alpha1
kind: Backup
metadata:
  name: physical-backup
spec:
  instanceRef:
    name: physical-source
  classRef:
    name: mariadb
  storageRef:
    name: seaweedfs-s3
  parameters:
    type: physical
