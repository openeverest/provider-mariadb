# On-demand physical backup of the source Instance to the MinIO storage.
apiVersion: backup.openeverest.io/v1alpha1
kind: Backup
metadata:
  name: physical-backup
spec:
  origin:
    type: Instance
    instanceRef:
      name: physical-source
  classRef:
    name: mariadb
  storageRef:
    name: minio-s3
  parameters:
    type: physical
