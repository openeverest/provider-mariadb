# A brand-new Instance seeded from the source's physical backup via
# spec.dataSource. The provider sets MariaDB.spec.bootstrapFrom to restore the
# physical snapshot into this fresh cluster. backup must be enabled with the
# same storage the source backup used (required by the dataSource validation).
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: physical-restored
spec:
  providerRef:
    name: mariadb
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: physical-backup
  components:
    engine:
      type: mariadb
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 1G
        requests:
          cpu: 250m
          memory: 512M
      storage:
        size: 1Gi
  backup:
    enabled: true
    classRef:
      name: mariadb-physical
    storages:
      - storageRef:
          name: minio-s3
