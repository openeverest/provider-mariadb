# While the exporter runs the provider publishes one probe endpoint per pod,
# served by the exporter pods; the runtime stamps the identity labels.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance-monitoring
status:
  phase: Ready
  (components[?name == 'engine'] | [0]):
    replicas: 1
    readyReplicas: 1
  (length(components)): 1
  monitoring:
    (destinations[?name == 'prometheus'] | [0]):
      mode: ExtensionManaged
    sources:
      identity:
        labels:
          openeverest_instance: test-instance-monitoring
          openeverest_namespace: ($namespace)
          openeverest_provider: mariadb
      metrics:
        - component: engine
          kind: mariadb
          podSelector:
            core.openeverest.io/instance: test-instance-monitoring
            app.kubernetes.io/name: exporter
            app.kubernetes.io/instance: test-instance-monitoring-metrics
          port: metrics
          path: /probe
          scheme: http
          params:
            target:
              - (join('', ['test-instance-monitoring-0.test-instance-monitoring-internal.', $namespace, '.svc.cluster.local:3306']))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-instance-monitoring-metrics
status:
  readyReplicas: 1
