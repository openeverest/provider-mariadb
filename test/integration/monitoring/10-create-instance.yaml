# Instance with monitoring enabled — exercises the provider's monitoring
# component wiring. The parameter shape mirrors examples/instance-monitoring.yaml
# and the MonitoringParameters struct in definition/components/types.go.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance-monitoring
spec:
  providerRef:
    name: mariadb
  components:
    engine:
      type: mariadb
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 1G
        requests:
          cpu: 250m
          memory: 512M
      storage:
        size: 1Gi
    monitoring:
      parameters:
        enabled: true
        serviceMonitor:
          prometheusRelease: test
          interval: 30s
          scrapeTimeout: 10s
