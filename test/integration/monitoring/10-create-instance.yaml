# Instance bound to the prometheus destination; no monitoring component.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance-monitoring
spec:
  providerRef:
    name: mariadb
  components:
    engine:
      type: mariadb
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 1G
        requests:
          cpu: 250m
          memory: 512M
      storage:
        size: 1Gi
  monitoring:
    destinations:
      - name: prometheus
        destinationRef:
          name: prometheus-it
