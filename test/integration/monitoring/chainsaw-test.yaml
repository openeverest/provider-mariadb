---
# Monitoring suite.
#
# Monitoring through Instance.spec.monitoring.destinations[]: an
# ExtensionManaged prometheus binding turns the mysqld-exporter on and
# publishes one metrics endpoint per MariaDB pod, replacing prometheus with
# victoriametrics keeps the exporter and endpoints, and dropping the last
# entry turns the exporter off and deletes its Deployment. No extension
# controller runs here, so the classes are claimed by hand and the bindings are
# never Configured; what the provider owns is asserted.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: monitoring
spec:
  description: |
    Bind an Instance to a class requiring metrics, verify the MariaDB CR runs
    the exporter without a ServiceMonitor and the Instance publishes the probe
    endpoints, switch to another such class, drop the destinations and verify
    the exporter is torn down, then delete the Instance.

  # Collect diagnostics when a step fails.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,mariadb,monitoringdestination,monitoringbinding,deploy,pods -o wide
    - script:
        content: kubectl -n $NAMESPACE get instance,mariadb,monitoringbinding -o yaml
    - script:
        content: kubectl get monitoringclass -o yaml
    - script:
        content: |
          ns=$(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
            -o jsonpath='{.items[0].metadata.namespace}')
          [ -n "$ns" ] && kubectl -n "$ns" logs -l app.kubernetes.io/name=provider-mariadb \
            --all-containers --tail 100 || echo "provider deployment not found"

  steps:
    - name: provider-deployed
      try:
        - script:
            content: |
              set -eu
              # Provider is installed in provider-system (CI) or default (plugin-hub);
              # assert an available replica regardless of namespace.
              avail=$(kubectl get deploy -A -l app.kubernetes.io/name=provider-mariadb \
                -o jsonpath='{.items[*].status.availableReplicas}')
              echo "provider available replicas: ${avail:-0}"
              echo "${avail}" | grep -q '[1-9]'

    - name: setup
      try:
        - apply:
            file: 00-install.yaml
        # Stand in for the extension controllers: a class is usable only once
        # its controller has claimed it at its current generation.
        - script:
            content: |
              for class in prometheus-it victoriametrics-it; do
                gen=$(kubectl get monitoringclass/$class -o jsonpath='{.metadata.generation}')
                kubectl patch monitoringclass/$class --subresource status --type merge \
                  -p '{"status":{"conditions":[{"type":"Accepted","status":"True","reason":"Accepted","message":"claimed by the test","observedGeneration":'"$gen"',"lastTransitionTime":"2026-01-01T00:00:00Z"}]}}'
              done
        - assert:
            file: 00-assert.yaml

    - name: create-instance-with-destination
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            file: 10-assert.yaml

    # Provisioning a real MariaDB and the exporter takes a while, so give the
    # readiness assertion a generous timeout.
    - name: instance-running
      timeouts:
        assert: 8m
      try:
        - assert:
            file: 11-assert.yaml

    - name: switch-prometheus-to-victoriametrics
      try:
        - apply:
            file: 12-switch-to-victoriametrics.yaml
        - assert:
            file: 12-assert.yaml
        - error:
            file: 12-errors.yaml

    - name: drop-destinations
      timeouts:
        assert: 2m
        error: 2m
      try:
        - apply:
            file: 20-drop-destinations.yaml
        - assert:
            file: 20-assert.yaml
        - error:
            file: 20-errors.yaml

    - name: delete-instance
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: test-instance-monitoring
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-instance-monitoring
            timeout: 2m
            for:
              deletion: {}
        - wait:
            apiVersion: k8s.mariadb.com/v1alpha1
            kind: MariaDB
            name: test-instance-monitoring
            timeout: 3m
            for:
              deletion: {}
