---
# A minimal prometheus class, under a test-local name.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: prometheus-it
spec:
  controllerName: test.openeverest.io/provider-mariadb-it
  extensionManaged:
    requires:
      metrics: true
  authModes:
    - name: Anonymous
  destinationParametersSchema:
    openAPIV3Schema:
      type: object
      properties:
        podMonitorLabels:
          type: object
          additionalProperties:
            type: string
---
# A minimal victoriametrics class, under a test-local name.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: victoriametrics-it
spec:
  controllerName: test.openeverest.io/provider-mariadb-it
  extensionManaged:
    requires:
      metrics: true
  authModes:
    - name: Anonymous
  destinationParametersSchema:
    openAPIV3Schema:
      type: object
      properties:
        vmPodScrapeLabels:
          type: object
          additionalProperties:
            type: string
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringDestination
metadata:
  name: prometheus-it
spec:
  classRef:
    name: prometheus-it
  parameters:
    podMonitorLabels:
      release: kps
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringDestination
metadata:
  name: victoriametrics-it
spec:
  classRef:
    name: victoriametrics-it
  parameters:
    vmPodScrapeLabels:
      release: vm
