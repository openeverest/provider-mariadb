# Default values for provider-mariadb.

# -- Number of replicas for the provider deployment
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/openeverest/provider-mariadb-dev
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: "latest"

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Automount API credentials for the service account
  automountServiceAccountToken: true
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Specifies whether RBAC resources should be created
  create: true

# -- Annotations to add to the deployment pods
podAnnotations: {}

# -- Labels to add to the deployment pods
podLabels: {}

podSecurityContext:
  # -- Run as non-root
  runAsNonRoot: true
  # -- Security context fsGroup
  fsGroup: 65534

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Drop all capabilities
  capabilities:
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Run as user ID
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Service port for the HTTP server (validation/health endpoints)
  port: 8082
  # -- The address the metrics endpoint binds to. Use "0" to disable.
  metricsBindAddress: ":8081"

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Deployment update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

# -- Number of old ReplicaSets to retain
revisionHistoryLimit: 1

# -- Termination grace period in seconds
terminationGracePeriodSeconds: 10

# -- Topology spread constraints for pod scheduling
topologySpreadConstraints: []

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

provider:
  # -- The name to register for the Provider custom resource
  name: mariadb
  # -- Short identifier for the provider, used in resource names
  # This appears in preset names (e.g., '<shortName>-standalone') and can be
  # used in other contexts where a short concise provider identifier is needed.
  shortName: mariadb

# -- Default instance presets configuration
# Each preset must have 'name', 'enabled', and 'spec' fields.
# The 'spec' field contains the full InstancePresetSpec.
# Note: The provider shortName will be automatically added to each preset name.
presets:
  - name: standalone
    enabled: true
    spec:
      providerRef:
        name: mariadb
      version: "11.4"
      topology:
        type: standalone
      components:
        engine:
          replicas: 1
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          storage:
            size: 10Gi
            # storageClass: ""  # Uncomment to pin a storage class

# -- Additional environment variables to set on the provider container
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- Additional volume mounts to add to the provider container
extraVolumeMounts: []

# -- Additional volumes to add to the pod
extraVolumes: []

# -- Leader election configuration
leaderElection:
  # -- Enable leader election (recommended for HA deployments)
  enabled: true

# =============================================================================
# mariadb-operator subchart values
# Reference: https://github.com/mariadb-operator/mariadb-operator/tree/main/deploy/charts/mariadb-operator
# =============================================================================
operator:
  # Operator log level
  logLevel: INFO
  # Whether the operator should watch only its own namespace
  currentNamespaceOnly: false
  crds:
    # Keep false: CRDs are managed by the separate operatorCrds subchart.
    # WARNING: Setting true means all MariaDB instances are deleted on helm uninstall.
    enabled: false

# =============================================================================
# mariadb-operator-crds subchart values
# Set enabled: true to install CRDs via this chart (recommended for fresh installs).
# Set enabled: false when CRDs are already installed or managed externally.
# =============================================================================
operatorCrds:
  enabled: true
