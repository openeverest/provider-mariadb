# Upgrade preflight: a pre-upgrade hook Job that runs the new provider image
# in preflight mode against the target catalog (the generated
# provider-spec.yaml this release applies, delivered via the ConfigMap below)
# and the live Instances. A non-zero exit aborts the upgrade before any
# resource is applied. Once the preflight passes, the Job turns off automatic
# data-plane updates on every MariaDB, so the upgraded operator does not roll
# the clusters before the provider holds the update for approval. Runs only on
# `helm upgrade`, never on install.
{{- $operatorVersion := "" }}
{{- range .Chart.Dependencies }}
{{- /* Helm rewrites a dependency's Name to its alias; mariadb-operator is aliased to "operator" */}}
{{- if eq .Name "operator" }}{{- $operatorVersion = .Version }}{{- end }}
{{- end }}
{{- if not $operatorVersion }}{{ fail "preflight-hook: operator dependency not found in .Chart.Dependencies" }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "provider-mariadb.fullname" . }}-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-mariadb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  provider-spec.yaml: |
{{ .Files.Get "generated/provider-spec.yaml" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "provider-mariadb.fullname" . }}-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-mariadb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
# Hook-scoped RBAC: the preflight reads the installed Provider, the Instances
# it manages and their MariaDB CRs, and patches the CRs to hold data-plane
# updates.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "provider-mariadb.fullname" . }}-preflight
  labels:
    {{- include "provider-mariadb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["core.openeverest.io"]
    resources: ["providers", "instances"]
    verbs: ["get", "list"]
  - apiGroups: ["k8s.mariadb.com"]
    resources: ["mariadbs"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "provider-mariadb.fullname" . }}-preflight
  labels:
    {{- include "provider-mariadb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "provider-mariadb.fullname" . }}-preflight
subjects:
  - kind: ServiceAccount
    name: {{ include "provider-mariadb.fullname" . }}-preflight
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "provider-mariadb.fullname" . }}-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provider-mariadb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  # Bound unschedulable or unpullable pods so a broken hook fails the upgrade
  # instead of hanging until the Helm timeout.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        # Not the shared labels helper: it embeds the Service's selector
        # labels, which must not match a pod that serves nothing.
        helm.sh/chart: {{ include "provider-mariadb.chart" . }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: preflight
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "provider-mariadb.fullname" . }}-preflight
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: preflight
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "provider-mariadb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --preflight-spec=/preflight/provider-spec.yaml
            - --hold-data-plane-updates
          env:
            # The operator version this release installs, for the data-plane
            # skew check.
            - name: TARGET_OPERATOR_VERSION
              value: {{ $operatorVersion | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: target-spec
              mountPath: /preflight
              readOnly: true
      volumes:
        - name: target-spec
          configMap:
            name: {{ include "provider-mariadb.fullname" . }}-preflight
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
