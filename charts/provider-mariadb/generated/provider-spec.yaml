    mariadb:
      defaultVersion: "12.3"
      versions:
        - image: mariadb:10.11
          version: "10.11"
        - image: mariadb:11.4
          version: "11.4"
        - image: mariadb:11.8
          version: "11.8"
        - image: mariadb:12.3
          version: "12.3"
