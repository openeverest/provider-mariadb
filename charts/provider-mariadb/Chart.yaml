apiVersion: v2
name: provider-mariadb
description: A Helm chart for deploying the OpenEverest MariaDB provider (backed by mariadb-operator)
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - openeverest
  - mariadb
  - mysql
  - provider
  - database
home: https://github.com/openeverest/provider-mariadb
sources:
  - https://github.com/openeverest/provider-mariadb
maintainers:
  - name: OpenEverest Contributors
dependencies:
  # mariadb-operator manages MariaDB lifecycle. Its CRDs are vendored at the
  # same version into generated/operator-crds.yaml (`make generate`) and
  # rendered by templates/operator-crds.yaml (condition: operatorCrds.enabled),
  # so they can be kept on helm uninstall.
  - name: mariadb-operator
    alias: operator
    version: "26.10.2"
    repository: https://mariadb-operator.github.io/mariadb-operator
