apiVersion: v2
name: provider-mariadb
description: A Helm chart for deploying the OpenEverest MariaDB provider (backed by mariadb-operator)
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - openeverest
  - mariadb
  - mysql
  - provider
  - database
home: https://github.com/openeverest/provider-mariadb
sources:
  - https://github.com/openeverest/provider-mariadb
maintainers:
  - name: OpenEverest Contributors
dependencies:
  # mariadb-operator manages MariaDB lifecycle. CRDs are installed via the
  # companion mariadb-operator-crds chart (condition: operator.crds.enabled).
  - name: mariadb-operator
    alias: operator
    version: "26.6.0"
    repository: https://mariadb-operator.github.io/mariadb-operator
  - name: mariadb-operator-crds
    alias: operatorCrds
    version: "26.6.0"
    repository: https://mariadb-operator.github.io/mariadb-operator
    condition: operatorCrds.enabled
